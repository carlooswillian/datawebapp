<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossas Datas</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animações e ajustes de Web App */
        body { -webkit-tap-highlight-color: transparent; }
        .card-transition { transition: all 0.3s ease; }
        .card-transition:active { transform: scale(0.98); }
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        /* Oculta scrollbar mas permite scroll */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-600">Nossas Datas ❤️</h1>
    </header>

    <!-- Lista de Cards -->
    <main id="cards-container" class="p-4 space-y-4">
        <p class="text-center text-gray-500 mt-10" id="loading-msg">Carregando datas...</p>
    </main>

    <!-- Botão Flutuante (FAB) -->
    <button onclick="toggleModal(true)" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl card-transition z-20">
        +
    </button>

    <!-- Modal de Adicionar Data -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 modal-enter relative">
            <button onclick="toggleModal(false)" class="absolute top-4 right-6 text-gray-400 font-bold text-xl">X</button>
            <h2 class="text-xl font-bold mb-6 text-gray-800">Nova Data Especial</h2>
            
            <form id="add-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Emoji</label>
                    <input type="text" id="emoji-input" placeholder="🎉" maxlength="2" class="mt-1 w-16 text-center text-2xl border-gray-300 border rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Título</label>
                    <input type="text" id="title-input" placeholder="Ex: Dia do Casamento" class="mt-1 w-full border-gray-300 border rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Data</label>
                    <input type="date" id="date-input" class="mt-1 w-full border-gray-300 border rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mt-4 card-transition" id="btn-salvar">
                    Salvar Data
                </button>
            </form>
        </div>
    </div>

    <script>
        // COLOQUE A URL DO SEU GOOGLE APPS SCRIPT AQUI
        const API_URL = "https://script.google.com/macros/s/AKfycbwb7wzDPK59bm_IPQEBq3aJCiK9xYY3x1i1alunem9GYeV4oPGjuaw3k87gKfN4CM77/exec";

        let eventsData = [];
        let viewMode = 'days'; // 'days' ou 'detailed'

        async function fetchDatas() {
            try {
                const response = await fetch(API_URL);
                eventsData = await response.json();
                renderCards();
            } catch (error) {
                document.getElementById('loading-msg').innerText = "Erro ao carregar os dados.";
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('add-form').reset();
            }
        }

        // Alterna entre mostrar total de dias ou anos/meses/dias
        function toggleViewMode() {
            viewMode = viewMode === 'days' ? 'detailed' : 'days';
            renderCards();
        }

        function calculateTime(dateString) {
            const targetDate = new Date(dateString + "T00:00:00"); // Força o fuso horário correto
            const now = new Date();
            now.setHours(0,0,0,0); // Zera as horas para comparar apenas os dias
            
            const diffTime = targetDate - now;
            const isFuture = diffTime > 0;
            const totalDays = Math.floor(Math.abs(diffTime) / (1000 * 60 * 60 * 24));

            if (totalDays === 0) return { text: "É hoje! 🎉", isFuture: true, class: "text-indigo-600" };

            if (viewMode === 'days') {
                return {
                    text: isFuture ? `Faltam ${totalDays} dias` : `Há ${totalDays} dias`,
                    isFuture: isFuture,
                    class: isFuture ? "text-green-500" : "text-gray-500"
                };
            } else {
                // Cálculo detalhado (aproximado para UI)
                let years = Math.floor(totalDays / 365);
                let months = Math.floor((totalDays % 365) / 30);
                let days = Math.floor((totalDays % 365) % 30);
                
                let parts = [];
                if (years > 0) parts.push(`${years} ano${years > 1 ? 's' : ''}`);
                if (months > 0) parts.push(`${months} mês${months > 1 ? 'es' : ''}`);
                if (days > 0 || parts.length === 0) parts.push(`${days} dia${days > 1 ? 's' : ''}`);
                
                return {
                    text: isFuture ? `Falta: ${parts.join(', ')}` : `Passou: ${parts.join(', ')}`,
                    isFuture: isFuture,
                    class: isFuture ? "text-green-500" : "text-gray-500"
                };
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            if (eventsData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 mt-10">Nenhuma data cadastrada ainda.</p>';
                return;
            }

            // Ordena para que os eventos futuros mais próximos fiquem no topo
            eventsData.sort((a, b) => new Date(a.data) - new Date(b.data));

            eventsData.forEach(event => {
                const timeInfo = calculateTime(event.data);
                
                // Formatando a data de DD-MM-YYYY para visualização
                const dateObj = new Date(event.data + "T00:00:00");
                const formattedDate = dateObj.toLocaleDateString('pt-BR');

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center card-transition cursor-pointer";
                card.onclick = toggleViewMode; // Clicar no card muda o formato de exibição

                card.innerHTML = `
                    <div class="text-4xl mr-4">${event.emoji || '📅'}</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg">${event.titulo}</h3>
                        <p class="text-sm text-gray-400">${formattedDate}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-sm ${timeInfo.class} bg-gray-50 py-1 px-3 rounded-full">
                            ${timeInfo.text}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
            
            const hint = document.createElement('p');
            hint.className = "text-center text-xs text-gray-400 mt-4";
            hint.innerText = "Dica: Toque nos cards para mudar o formato de visualização.";
            container.appendChild(hint);
        }

        // Enviando nova data para o Google Sheets
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const newData = {
                emoji: document.getElementById('emoji-input').value,
                titulo: document.getElementById('title-input').value,
                data: document.getElementById('date-input').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(newData)
                });
                // Recarrega as datas
                await fetchDatas();
                toggleModal(false);
            } catch (error) {
                alert("Erro ao salvar. Tente novamente.");
            } finally {
                btn.innerText = "Salvar Data";
                btn.disabled = false;
            }
        });

        // Inicia carregando os dados
        fetchDatas();
    </script>
</body>
</html>
