<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datas Importantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .card-transition { transition: all 0.3s ease; }
        .card-transition:active { transform: scale(0.98); }
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-24">

    <!-- Header com Ícone de Configurações -->
    <header class="bg-white shadow-sm sticky top-0 z-10 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-600">Datas Importantes</h1>
        <!-- Alterado para abrir o modal de configurações -->
        <button onclick="toggleSettingsModal(true)" class="text-gray-400 hover:text-indigo-600 transition-colors p-2" title="Configurações">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </header>

    <!-- Lista de Cards -->
    <main id="cards-container" class="p-4 space-y-4">
        <p class="text-center text-gray-500 mt-10" id="loading-msg">Carregando datas...</p>
    </main>

    <!-- Botão Flutuante (FAB) -->
    <button onclick="toggleModal(true)" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl card-transition z-20">
        +
    </button>

    <!-- Modal de Adicionar Data -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 modal-enter relative">
            <button onclick="toggleModal(false)" class="absolute top-4 right-6 text-gray-400 font-bold text-xl">X</button>
            <h2 class="text-xl font-bold mb-6 text-gray-800">Nova Data Especial</h2>
            
            <form id="add-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Emoji</label>
                    <input type="text" id="emoji-input" placeholder="✈️" maxlength="2" class="mt-1 w-16 text-center text-2xl border-gray-300 border rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Título</label>
                    <input type="text" id="title-input" placeholder="Ex: Viagem para Porto Seguro" class="mt-1 w-full border-gray-300 border rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Data</label>
                    <input type="date" id="date-input" class="mt-1 w-full border-gray-300 border rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mt-4 card-transition" id="btn-salvar">
                    Salvar Data
                </button>
            </form>
        </div>
    </div>

    <!-- Modal de Configurações -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 modal-enter relative">
            <button onclick="toggleSettingsModal(false)" class="absolute top-4 right-6 text-gray-400 font-bold text-xl">X</button>
            <h2 class="text-xl font-bold mb-6 text-gray-800">Configurações</h2>
            
            <div class="space-y-6">
                <!-- Configuração: Formato da Contagem -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Formato da contagem</label>
                    <select id="view-mode-select" onchange="changeViewMode(this.value)" class="w-full border-gray-300 border rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white text-gray-700">
                        <option value="days">Apenas Dias (Ex: Faltam 50 dias)</option>
                        <option value="detailed">Anos, Meses e Dias (Detalhado)</option>
                    </select>
                </div>

                <!-- Espaço para futuras configurações (Placeholder) -->
                <div class="py-4 border-t border-gray-100">
                    <p class="text-sm text-center text-gray-400 italic">Mais opções em breve...</p>
                </div>
            </div>

            <button onclick="toggleSettingsModal(false)" class="w-full bg-gray-100 text-gray-700 font-bold py-3 rounded-xl mt-4 card-transition hover:bg-gray-200">
                Fechar
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwb7wzDPK59bm_IPQEBq3aJCiK9xYY3x1i1alunem9GYeV4oPGjuaw3k87gKfN4CM77/exec";

        let eventsData = [];
        
        // Puxa a preferência salva no celular, se não houver, usa 'days' como padrão
        let viewMode = localStorage.getItem('viewModePref') || 'days'; 

        async function fetchDatas() {
            try {
                const response = await fetch(API_URL);
                eventsData = await response.json();
                renderCards();
            } catch (error) {
                document.getElementById('loading-msg').innerText = "Erro ao carregar os dados.";
            }
        }

        // Controla o pop-up de Adicionar Data
        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('add-form').reset();
            }
        }

        // Controla o pop-up de Configurações
        function toggleSettingsModal(show) {
            const modal = document.getElementById('settings-modal');
            if (show) {
                // Atualiza o select para mostrar a opção que está em uso
                document.getElementById('view-mode-select').value = viewMode;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // Função que muda a visualização quando o usuário escolhe no Select
        function changeViewMode(newMode) {
            viewMode = newMode;
            // Salva a escolha no celular da pessoa
            localStorage.setItem('viewModePref', newMode);
            // Atualiza os cards imediatamente
            renderCards();
        }

        function parseValidDate(dateStr) {
            if (!dateStr) return new Date();
            let cleanDateStr = String(dateStr).split('T')[0].trim();
            
            let parts = cleanDateStr.split('-');
            if (parts.length === 3) {
                return new Date(parts[0], parts[1] - 1, parts[2]); 
            }
            return new Date(dateStr);
        }

        function calculateTime(dateString) {
            const targetDate = parseValidDate(dateString);
            
            const now = new Date();
            now.setHours(0,0,0,0);
            
            const diffTime = targetDate.getTime() - now.getTime();
            const isFuture = diffTime > 0;
            const totalDays = Math.floor(Math.abs(diffTime) / (1000 * 60 * 60 * 24));

            if (totalDays === 0) return { text: "É hoje! 🎉", class: "text-indigo-600 bg-indigo-50" };

            if (viewMode === 'days') {
                return {
                    text: isFuture ? `Faltam ${totalDays} dias` : `Há ${totalDays} dias`,
                    class: isFuture ? "text-green-600 bg-green-50" : "text-gray-500 bg-gray-100"
                };
            } else {
                let years = Math.floor(totalDays / 365);
                let months = Math.floor((totalDays % 365) / 30);
                let days = Math.floor((totalDays % 365) % 30);
                
                let parts = [];
                if (years > 0) parts.push(`${years} ano${years > 1 ? 's' : ''}`);
                if (months > 0) parts.push(`${months} mês${months > 1 ? 'es' : ''}`);
                if (days > 0 || parts.length === 0) parts.push(`${days} dia${days > 1 ? 's' : ''}`);
                
                return {
                    text: isFuture ? `Falta: ${parts.join(', ')}` : `Passou: ${parts.join(', ')}`,
                    class: isFuture ? "text-green-600 bg-green-50" : "text-gray-500 bg-gray-100"
                };
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            if (eventsData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 mt-10">Nenhuma data cadastrada ainda.</p>';
                return;
            }

            eventsData.sort((a, b) => parseValidDate(a.data).getTime() - parseValidDate(b.data).getTime());

            eventsData.forEach(event => {
                const timeInfo = calculateTime(event.data);
                const dateObj = parseValidDate(event.data);
                const formattedDate = dateObj.toLocaleDateString('pt-BR');

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center";

                card.innerHTML = `
                    <div class="text-4xl mr-4">${event.emoji || '📅'}</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg">${event.titulo}</h3>
                        <p class="text-sm text-gray-400">${formattedDate}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-sm ${timeInfo.class} py-1 px-3 rounded-full">
                            ${timeInfo.text}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const newData = {
                emoji: document.getElementById('emoji-input').value,
                titulo: document.getElementById('title-input').value,
                data: document.getElementById('date-input').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(newData)
                });
                await fetchDatas();
                toggleModal(false);
            } catch (error) {
                alert("Erro ao salvar. Tente novamente.");
            } finally {
                btn.innerText = "Salvar Data";
                btn.disabled = false;
            }
        });

        // Inicia carregando os dados
        fetchDatas();
    </script>
</body>
</html>
